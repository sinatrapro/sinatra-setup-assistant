<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sinatra Setup Assistant</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <img src="images/logo.png" alt="Sinatra Setup Assistant" />
      <h1 data-i18n="title">Assistente de configuração</h1>
      <p class="description" data-i18n="setupDescription">
        Clique para configurar o Sinatra na sua conta VTEX.
      </p>
      <button id="runSetup" data-i18n="setupButton">
        Iniciar configuração
      </button>
      <p id="status"></p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
